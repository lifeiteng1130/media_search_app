name: media_search_app
description: A media resource search app for novels, movies, TV shows, and anime.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 网络请求
  dio: ^5.4.0

  # 路由
  go_router: ^13.0.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 视频播放
  video_player: ^2.8.3
  chewie: ^1.7.4

  # HTML 解析
  html: ^0.15.4

  # 图片缓存
  cached_network_image: ^3.3.1

  # URL launcher
  url_launcher: ^6.2.3

  # 分享
  share_plus: ^7.2.1

  # 文件路径和存储
  path_provider: ^2.1.1

  # 权限管理
  permission_handler: ^11.1.0

  # 日期格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - lib/features/novel/data/default_sources.json
